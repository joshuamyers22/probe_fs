name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python experiments/reproduce.py verify
      - run: uv run python experiments/reproduce_public_calibration.py
      - run: uv run python experiments/reproduce_public_results.py
      - run: uv run python experiments/reproduce_public_selection.py
      - if: matrix.python-version == '3.12'
        run: uv run python experiments/reproduce.py smoke --output artifacts/ci-smoke
      - run: uv build
      - if: matrix.python-version == '3.12'
        run: uv run python experiments/reproduce.py analyze --allow-roundoff --output artifacts/ci-reanalysis
      - if: matrix.python-version == '3.12'
        run: uv run python experiments/reproduce_public_calibration.py --output artifacts/ci-public-cost
      - if: matrix.python-version == '3.12'
        run: uv run python experiments/reproduce_public_results.py --output artifacts/ci-public-results
      - if: matrix.python-version == '3.12'
        run: uv run python experiments/reproduce_public_selection.py --output artifacts/ci-public-selection
      - if: matrix.python-version == '3.12'
        run: uv run python experiments/build_benchmark.py
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: probe-fs-reproducibility
          path: |
            artifacts/probe-fs-reproducibility-v1.zip
            artifacts/probe-fs-reproducibility-v1.sha256
            artifacts/ci-smoke/smoke-verification.json
            artifacts/ci-reanalysis/reanalysis-verification.json
            artifacts/ci-public-cost/calibration-verification.json
            artifacts/ci-public-results/public-results-verification.json
            artifacts/ci-public-selection/public-selection-verification.json
          if-no-files-found: error
